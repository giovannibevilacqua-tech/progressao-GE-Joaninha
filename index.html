<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6D1026">
<title>Progressão Jovens GE Joaninha</title>
<style>
:root {
--vinho: #1A6B3C;
--vinho2: #23884D;
--azul: #1B3B6F;
--azul2: #2A5298;
--done: #27AE60;
--done-bg: #D4EFDF;
--focus-y: #FFFBEA;
--focus-b: #F39C12;
--bg: #F0EDE8;
--card: #FFFFFF;
--text: #1A1A1A;
--muted: #666;
--border: #E0D8D0;
--r: 10px;
--shadow: 0 2px 8px rgba(0,0,0,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

.login-gate-ov {
position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
background: linear-gradient(160deg, #C1121F 0%, #9A0D18 60%, #E63946 100%); padding: 20px;
}
.login-gate-box {
background: var(--card); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.3);
padding: 32px 26px; width: 100%; max-width: 340px; text-align: center;
}
.login-erro-msg {
margin-top: 10px; padding: 9px 11px; background: #FDECEA; color: #C0392B;
border-radius: 8px; font-size: 11px; font-weight: 600; text-align: left; line-height: 1.4;
}
.info-icone-tip { position: relative; display: inline-flex; cursor: help; font-size: 12px; }
.info-icone-tip-balao {
display: none; position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
background: #1A1A1A; color: #fff; font-size: 10px; font-weight: 600; text-transform: none;
letter-spacing: normal; padding: 7px 10px; border-radius: 7px; white-space: nowrap; z-index: 10;
box-shadow: 0 3px 10px rgba(0,0,0,.25);
}
.info-icone-tip-balao::after {
content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
border: 5px solid transparent; border-top-color: #1A1A1A;
}
.info-icone-tip:hover .info-icone-tip-balao, .info-icone-tip:active .info-icone-tip-balao { display: block; }

body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding-bottom: 40px;
}
.header {
background: linear-gradient(160deg, #C1121F 0%, #9A0D18 60%, #E63946 100%);
color: #fff;
padding: 20px 16px 16px;
text-align: center;
transition: padding .25s ease;
}
.header.compacto { padding: 8px 16px; }
.header-flor { font-size: 30px; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); transition: opacity .2s ease, max-height .2s ease, margin .2s ease; max-height: 40px; overflow: hidden; }
.header.compacto .header-flor { opacity: 0; max-height: 0; margin: 0; }
.header h1 { font-size: 17px; font-weight: 800; letter-spacing: .5px; line-height: 1.3; transition: font-size .2s ease; }
.header.compacto h1 { font-size: 13px; }
.header .sub { font-size: 12px; opacity: .82; margin-top: 4px; transition: opacity .2s ease, max-height .2s ease, margin .2s ease; max-height: 30px; overflow: hidden; }
.header.compacto .sub { opacity: 0; max-height: 0; margin: 0; }
.header-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; transition: opacity .2s ease, max-height .2s ease, margin .2s ease; max-height: 40px; overflow: hidden; }
.header.compacto .header-chips { opacity: 0; max-height: 0; margin: 0; }
.chip { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); border-radius: 20px; font-size: 11px; font-weight: 600; padding: 3px 10px; }
.alert {
margin: 14px 14px 0;
background: var(--focus-y);
border-left: 4px solid var(--focus-b);
border-radius: 0 var(--r) var(--r) 0;
padding: 10px 12px;
font-size: 12px; color: #7A4A00; line-height: 1.5;
}
.section-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
.roster-section {
margin: 14px 14px 0;
background: var(--card);
border-radius: var(--r);
padding: 14px;
box-shadow: var(--shadow);
}
.roster-row {
display: flex; flex-direction: column; gap: 6px;
padding: 10px; margin-bottom: 6px; border-radius: 10px; cursor: pointer;
border: 1px solid var(--border); background: #FAFAF8; position: relative;
}
.roster-row:last-child { margin-bottom: 0; }
.roster-row:hover { background: #ECE5D8; box-shadow: inset 3px 0 0 var(--vinho); }
.roster-row.active { background: var(--done-bg); border-color: var(--done); }
.roster-row.marcado-conversar {
background: #E8F1FC; border-color: #1565C0; border-width: 2px;
box-shadow: 0 0 0 3px #1565C022, 0 3px 10px rgba(21,101,192,.22);
}
.roster-row.marcado-conversar:hover { background: #DCEBFA; }
.faixa-conversar {
display: flex; align-items: center; gap: 5px; background: #1565C0; color: #fff;
font-size: 10px; font-weight: 800; padding: 4px 9px; border-radius: 8px 8px 0 0;
margin: -10px -10px 4px -10px; letter-spacing: .3px;
}
.roster-linha-principal {
display: flex; align-items: center; gap: 8px;
}
.roster-avatar {
width: 26px; height: 26px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.roster-name { flex: 1; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cargo-badge { display: inline-flex; align-items: center; gap: 2px; padding: 3px 4px; border-radius: 3px; background: #14182B; flex-shrink: 0; }
.cargo-bar { width: 4px; height: 11px; border-radius: 1px; background: #2A3050; }
.cargo-bar.on { background: #2ECC71; }
.roster-track { flex: 1; height: 9px; background: #EEEBE7; border-radius: 20px; overflow: hidden; }
.roster-bar { height: 100%; background: var(--vinho); border-radius: 20px; }
.roster-linha-progresso { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.roster-etapa {
font-size: 11px; font-weight: 800; text-align: center; white-space: nowrap;
padding: 4px 8px; border-radius: 20px; flex-shrink: 0;
}
.roster-menu-btn { border: none; background: none; color: var(--muted); font-size: 16px; font-weight: 900; cursor: pointer; padding: 10px 10px; margin: -8px -6px -8px 0; border-radius: 8px; line-height: 1; flex-shrink: 0; }
.roster-menu-btn:hover { background: #F0EDE8; color: var(--text); }
.roster-dropdown {
position: absolute; top: 38px; right: 10px; background: var(--card); border: 1px solid var(--border);
border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; z-index: 20; min-width: 130px;
}
.roster-dropdown button {
display: block; width: 100%; text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 700;
border: none; background: var(--card); color: var(--text); cursor: pointer;
}
.roster-dropdown button:hover { background: #F5F3EF; }
.roster-dropdown button.remover { color: #E74C3C; }
.obs-modal-ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: flex-end; justify-content: center; }
.obs-modal-ov.open { display: flex; }
.obs-modal-box { background: var(--card); border-radius: 16px 16px 0 0; padding: 20px 18px 26px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
.obs-modal-titulo { font-size: 15px; font-weight: 800; color: var(--vinho); margin-bottom: 10px; }
.obs-modal-texto { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-line; }

.paxtu-txt { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0 0 13px; }
.paxtu-txt strong { color: var(--text); }
.paxtu-ramos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-bottom: 15px; }
.paxtu-ramo { min-height: 54px; padding: 7px 5px; border: 1.5px solid var(--border); border-radius: var(--r); background: var(--card); color: var(--text); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.paxtu-ramo.sel { border-color: var(--vinho); background: var(--done-bg); color: var(--vinho); box-shadow: inset 0 0 0 1px var(--vinho); }
.paxtu-ramo:disabled { background: #F4F1EC; color: #8A837B; cursor: not-allowed; }
.paxtu-ramo small { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; }
.paxtu-envio { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 17px 12px; border: 2px dashed var(--border); border-radius: var(--r); background: var(--card); cursor: pointer; font-size: 13px; text-align: center; }
.paxtu-envio:hover, .paxtu-envio:focus-within { border-color: var(--vinho); }
.paxtu-envio input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.paxtu-envio span { font-size: 11px; color: var(--muted); }
.paxtu-arqs { margin: 9px 0 0; padding-left: 17px; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.paxtu-acao { width: 100%; margin-top: 14px; }
.paxtu-acao:disabled, #paxtuGravar:disabled { opacity: .5; cursor: not-allowed; }
.paxtu-msg { margin-top: 11px; padding: 9px 11px; border-radius: 8px; background: #EAF2FB; color: var(--azul); font-size: 11px; font-weight: 600; line-height: 1.4; }
.paxtu-msg.erro { background: #FDECEA; color: #C0392B; }
.paxtu-lista { display: flex; flex-direction: column; gap: 9px; }
.paxtu-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 11px; }
.paxtu-item.off { opacity: .62; }
.paxtu-nome { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; cursor: pointer; margin-bottom: 9px; }
.paxtu-nome input { width: 17px; height: 17px; margin: 1px 0 0; flex-shrink: 0; }
.paxtu-nome span { min-width: 0; overflow-wrap: anywhere; }
.paxtu-nome small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
.paxtu-sel { width: 100%; font-size: 12px; }
.paxtu-mud { margin: 8px 0 0; padding-left: 16px; font-size: 11px; color: var(--muted); line-height: 1.45; }
.paxtu-aviso { margin-top: 8px; padding: 7px 9px; border-radius: 7px; background: var(--focus-y); color: #7A5200; font-size: 11px; line-height: 1.4; }
.paxtu-botoes { display: flex; gap: 8px; margin-top: 13px; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 2px; }
.paxtu-botoes button { flex: 1; margin-top: 0; }
.paxtu-ok { text-align: center; padding: 16px 8px; font-size: 13px; }
.paxtu-ok > div { width: 46px; height: 46px; line-height: 46px; margin: 0 auto 10px; border-radius: 50%; background: var(--done); color: #fff; font-size: 23px; font-weight: 900; }
.paxtu-ok p { font-size: 12px; color: var(--muted); margin: 6px 0 14px; }
.lis-modal-ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: flex-end; justify-content: center; padding: 0 10px; box-sizing: border-box; }
.lis-modal-ov.open { display: flex; }
.lis-modal-box { background: var(--bg); border-radius: 16px 16px 0 0; padding: 0; width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; }
#eventoModalOv .lis-modal-box {
border-radius: 16px; margin: 0 auto 14px;
scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.25) transparent;
}
#eventoModalOv .lis-modal-box::-webkit-scrollbar { width: 6px; }
#eventoModalOv .lis-modal-box::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
#eventoModalOv .lis-modal-box::-webkit-scrollbar-thumb { background: rgba(0,0,0,.25); border-radius: 10px; }
#eventoModalOv.centralizado { align-items: center; }
#eventoModalOv.centralizado .lis-modal-box { margin: 20px auto; max-height: 85vh; max-height: 85dvh; }
#fichaModalOv { align-items: center; }
#fichaModalOv .lis-modal-box {
border-radius: 16px; margin: 20px auto; max-height: 85vh; max-height: 85dvh;
scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.25) transparent;
}
#fichaModalOv .lis-modal-box::-webkit-scrollbar { width: 6px; }
#fichaModalOv .lis-modal-box::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
#fichaModalOv .lis-modal-box::-webkit-scrollbar-thumb { background: rgba(0,0,0,.25); border-radius: 10px; }
#chefesModalOv { align-items: center; }
#chefesModalOv .lis-modal-box { border-radius: 16px; margin: 20px auto; max-height: 85vh; max-height: 85dvh; }
.chefe-add-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.chefe-add-row input { width: 100%; }
.chefe-add-btn { align-self: flex-end; width: auto; background: var(--vinho); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.chefe-add-btn:hover { background: var(--vinho2); }
.chefe-row { display: flex; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid #F0EDE8; }
.chefe-row:last-child { border-bottom: none; }
.chefe-row-registro { font-size: 13px; font-weight: 700; flex: 1; }
.chefe-badge-admin { font-size: 9px; font-weight: 800; background: #FDEBD0; color: #A85D00; padding: 2px 7px; border-radius: 10px; }
.chefe-row-btn { border: 1px solid var(--border); background: var(--card); font-size: 10px; font-weight: 700; padding: 5px 8px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.sw-lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.sw { position: relative; display: inline-block; width: 36px; height: 20px; }
.sw input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; background: #8886; border-radius: 20px; transition: background .2s; }
.sw i::before { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw input:checked + i { background: #27AE60; }
.sw input:checked + i::before { transform: translateX(16px); }
.chefe-tag { display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 20px; margin-top: 3px; }
.chefe-tag.chefe { background: #1565C033; color: #5C9BE6; }
.chefe-tag.ass { background: #E67E2233; color: #E69A4D; }
.chefe-tag.adm { background: #D4A01733; color: #D4A017; }
.chefe-row-btn.remover { color: #E74C3C; border-color: #F5C6C0; }
.chefe-row-btn[title="Editar nome"] { padding: 5px 7px; font-size: 12px; }
.lis-modal-header { position: sticky; top: 0; z-index: 5; background: var(--card); padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.lis-modal-titulo { font-size: 15px; font-weight: 800; color: var(--vinho); }
.lis-modal-fechar { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 0 4px; }
.lis-modal-body { padding: 14px 16px 26px; }
.ep-pillar { background: var(--card); margin: 0 0 10px; border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.ep-ph { padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #F0EDE8; }
.ep-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; flex-shrink: 0; }
.ep-pb { padding: 10px 14px 14px; }
.ep-fl { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 8px 0 5px; display: block; }
.ep-sel { width: 100%; padding: 9px 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--card); outline: none; cursor: pointer; font-family: inherit; }
.ep-sel:focus { border-color: var(--vinho); }
.ep-ta { width: 100%; padding: 9px 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 12px; resize: vertical; min-height: 70px; outline: none; font-family: inherit; }
.ep-ta:focus { border-color: var(--vinho); }
.ep-di { width: 100%; padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 12px; outline: none; font-family: inherit; }
.ep-di:focus { border-color: var(--vinho); }
.ep-sub { background: #FAFAF8; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.roster-linha-idade { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.idade-track { position: relative; flex: 1; height: 4px; border-radius: 20px; overflow: hidden; background: #EEEBE7; }
.idade-fill { height: 100%; border-radius: 20px; }
.idade-label { font-size: 9px; font-weight: 700; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.idade-label.caminho { color: #E74C3C; font-weight: 900; }
.roster-edicao { display: flex; flex-direction: column; gap: 8px; }
.roster-edicao .btn-primario, .roster-edicao .btn-secundario { margin-top: 0; }
.roster-edicao-btns { display: flex; gap: 8px; }
.roster-edicao-btns button { flex: 1; }

.patrulha-form { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px dashed var(--border); border-radius: 10px; }
.patrulha-form-row { display: flex; gap: 8px; align-items: center; }
.patrulha-form-row input[type=color] { width: 44px; height: 38px; border-radius: 8px; border: 1px solid var(--border); padding: 2px; cursor: pointer; background: none; }
.patrulha-form-row .campo-input { flex: 1; }

.patrulhas-grid { display: flex; flex-direction: column; }
.patrulha-secao { margin: 10px 14px 0; position: relative; }
@media (min-width: 640px) {
.patrulhas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; max-width: 1120px; margin: 0 auto; }
.patrulhas-grid .patrulha-secao { margin: 10px 7px 0; }
}
.patrulha-secao-header {
display: flex; align-items: center; justify-content: space-between; padding: 9px 12px;
border-radius: 10px 10px 0 0; color: #fff; font-size: 11px; font-weight: 800;
}
.patrulha-secao-header-direita { display: flex; align-items: center; gap: 4px; }
.patrulha-secao-count { background: rgba(255,255,255,.28); padding: 1px 9px; border-radius: 20px; font-size: 10px; font-weight: 800; }
.patrulha-menu-btn { border: none; background: none; color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; padding: 1px 5px; border-radius: 6px; line-height: 1; }
.patrulha-menu-btn:hover { background: rgba(255,255,255,.25); }
.patrulha-dropdown {
position: absolute; top: 38px; right: 0; background: var(--card); border: 1px solid var(--border);
border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; z-index: 20; min-width: 130px;
}
.patrulha-dropdown button {
display: block; width: 100%; text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 700;
border: none; background: var(--card); color: var(--text); cursor: pointer;
}
.patrulha-dropdown button:hover { background: #F5F3EF; }
.patrulha-dropdown button.remover { color: #E74C3C; }
.patrulha-drop-zone {
background: #FAFAF8; border: 1px dashed var(--border); border-top: none;
border-radius: 0 0 10px 10px; padding: 6px; min-height: 46px; transition: background .15s ease, border-color .15s ease;
}
.patrulha-drop-zone.drag-over { background: var(--done-bg); border-color: var(--done); }
.patrulha-vazia { font-size: 11px; color: var(--muted); text-align: center; padding: 14px; }

.add-jovem-wrap { margin-top: 10px; padding-top: 10px; border-top: 1px solid #F2EFEA; }
.btn-add-jovem {
width: 100%; font-size: 12px; font-weight: 700; color: #fff; background: var(--vinho);
border: none; border-radius: 8px; padding: 11px 14px; cursor: pointer;
}
.btn-add-jovem:hover { background: var(--vinho2); }
.add-jovem-row { display: flex; flex-direction: column; gap: 8px; }
.add-jovem-row input, .add-jovem-row textarea {
width: 100%; font-size: 12px; padding: 8px 10px; border-radius: 8px;
border: 1px solid var(--border); background: #FAFAF8; font-family: inherit;
}
.add-jovem-row input:focus, .add-jovem-row textarea:focus { outline: none; border-color: var(--vinho); }
.add-jovem-row label.campo-label { font-size: 10px; font-weight: 700; color: var(--muted); margin-bottom: 2px; display: block; }
.add-jovem-row-btns { display: flex; gap: 8px; }
.add-jovem-row-btns button {
flex: 1; font-size: 11px; font-weight: 700; border: none; border-radius: 8px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
}
.add-jovem-row-btns .btn-confirmar { color: #fff; background: var(--vinho); }
.add-jovem-row-btns .btn-confirmar:hover { background: var(--vinho2); }
.add-jovem-row-btns .btn-cancelar { color: var(--text); background: #EEEBE7; }
.add-jovem-row-btns .btn-cancelar:hover { background: #E3DFD9; }

.detail-section { margin: 14px 14px 0; }
.detail-head {
background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
padding: 14px;

<script>
// ── Autenticação por Registro Escoteiro (login real — resolve o aviso de segurança do Firebase) ──
const FIREBASE_WEB_API_KEY = "AIzaSyB50r7SU6qU_dwq03v_oQksLi1bAxbU614";
const DB_URL = "https://joaninha-progressao-default-rtdb.firebaseio.com";
const DOMINIO_LOGIN = "@joaninha.app";
const REGISTRO_BOOTSTRAP_ADMIN = "426603"; // primeiro admin — a conta é criada sozinha no primeiro login dele, se ainda não existir

let firebaseAuthToken = null;
let firebaseRefreshToken = null;
let registroLogado = null;
let souAdmin = false;
let tropaDoChefeLogado = null; // seção do chefe: 'alcateia' | 'escoteira' | 'senior' | 'cla' | 'diretoria' | null (admin não tem seção)

function emailDoRegistro(registro) { return registro + DOMINIO_LOGIN; }

let firebaseUid = null;
V2.configurarAuth({ getToken: () => firebaseAuthToken }); // leituras e gravações da tela principal usam o login atual

function salvarSessao() {
try {
localStorage.setItem('chefeSessao', JSON.stringify({
registro: registroLogado,
uid: firebaseUid,
idToken: firebaseAuthToken,
refreshToken: firebaseRefreshToken,
expiraEm: Date.now() + 55 * 60 * 1000,
admin: souAdmin,
tropa: tropaDoChefeLogado
}));
} catch (e) {}
}
function limparSessao() {
try { localStorage.removeItem('chefeSessao'); } catch (e) {}
V2.limparCacheLocal();
firebaseAuthToken = null; firebaseRefreshToken = null; registroLogado = null; firebaseUid = null; souAdmin = false; tropaDoChefeLogado = null;
}
function lerSessaoSalva() {
try {
const v = localStorage.getItem('chefeSessao');
return v ? JSON.parse(v) : null;
} catch (e) { return null; }
}

async function tentarRestaurarSessao() {
const salva = lerSessaoSalva();
if (!salva) return false;
if (Date.now() < salva.expiraEm && salva.idToken) {
firebaseAuthToken = salva.idToken;
firebaseRefreshToken = salva.refreshToken;
registroLogado = salva.registro;
firebaseUid = salva.uid;
} else {
let renovado = await renovarTokenSessao(salva.refreshToken);
if (!renovado) {
// Pode ser instabilidade passageira de rede (ex: computador acabou de acordar do sono) — tenta mais uma vez antes de desistir
await new Promise(r => setTimeout(r, 1500));
renovado = await renovarTokenSessao(salva.refreshToken);
}
if (!renovado && navigator.onLine === false && salva.uid) {
// sem internet: entra só para leitura (os dados vêm da cópia guardada neste aparelho)
firebaseAuthToken = salva.idToken; firebaseRefreshToken = salva.refreshToken; registroLogado = salva.registro; firebaseUid = salva.uid;
souAdmin = salva.admin === true; tropaDoChefeLogado = salva.tropa || null; nomeLogado = salva.nome || '';
return true;
}
if (!renovado) { limparSessao(); return false; }
firebaseAuthToken = renovado.idToken;
firebaseRefreshToken = renovado.refreshToken;
registroLogado = salva.registro;
firebaseUid = salva.uid;
salvarSessao();
}
await checarSeSouAdmin();
agendarRenovacaoToken();
return true;
}

function agendarRenovacaoToken() {
setTimeout(tentarRenovarTokenAgendado, 50 * 60 * 1000);
}
async function tentarRenovarTokenAgendado() {
if (!firebaseRefreshToken) return;
const renovado = await renovarTokenSessao(firebaseRefreshToken);
if (renovado) {
firebaseAuthToken = renovado.idToken;
firebaseRefreshToken = renovado.refreshToken;
salvarSessao();
agendarRenovacaoToken();
} else {
// Falhou (ex: computador estava dormindo, rede instável) — tenta de novo em 2 min em vez de desistir pra sempre
setTimeout(tentarRenovarTokenAgendado, 2 * 60 * 1000);
}
}
document.addEventListener('visibilitychange', () => {
if (document.visibilityState !== 'visible' || !firebaseRefreshToken) return;
const salva = lerSessaoSalva();
if (salva && Date.now() >= salva.expiraEm) tentarRenovarTokenAgendado();
});

function mapearErroFirebaseLogin(codigo) {
const mapa = {
'EMAIL_NOT_FOUND': 'Registro não encontrado. Confira o número (sem o dígito) ou peça pra um admin te cadastrar.',
'INVALID_PASSWORD': 'Registro incorreto. Confira o número, sem o dígito verificador.',
'INVALID_LOGIN_CREDENTIALS': 'Registro incorreto ou não cadastrado. Confira o número, sem o dígito verificador.',
'USER_DISABLED': 'Esse acesso foi desativado. Fale com um admin.',
'TOO_MANY_ATTEMPTS_TRY_LATER': 'Muitas tentativas seguidas. Espera um pouco e tenta de novo.'
};
return mapa[codigo] || 'Não foi possível entrar. Confira o registro e tente de novo.';
}

async function fazerLoginRegistro(registro, senha) {
registro = (registro || '').trim();
if (!registro) return { erro: true, mensagem: 'Digite o registro escoteiro.' };
// Senha padrão = número do registro (retrocompatível)
senha = (senha || '').trim() || registro;
const email = emailDoRegistro(registro);
// Firebase Auth usa SEMPRE o registro como senha (a "senha do app" é verificada via banco)
let resp = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + FIREBASE_WEB_API_KEY, {
method: 'POST', headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ email, password: registro, returnSecureToken: true })
});
let data = await resp.json();
if (data.error) {
const codigo = data.error.message;
const podeSerBootstrap = registro === REGISTRO_BOOTSTRAP_ADMIN && (codigo === 'EMAIL_NOT_FOUND' || codigo === 'INVALID_LOGIN_CREDENTIALS');
if (podeSerBootstrap) {
resp = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FIREBASE_WEB_API_KEY, {
method: 'POST', headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ email, password: registro, returnSecureToken: true })
});
data = await resp.json();
if (data.error) return { erro: true, mensagem: 'Não foi possível criar o primeiro acesso. Tenta de novo em instantes.' };
firebaseAuthToken = data.idToken;
firebaseRefreshToken = data.refreshToken;
firebaseUid = data.localId;
registroLogado = registro;
try {
await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + firebaseUid + '.json'), { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ registro: registro, admin: true, criadoEm: new Date().toISOString() }) });
} catch (e) {}
souAdmin = true;
tropaDoChefeLogado = null;
salvarSessao();
agendarRenovacaoToken();
return { erro: false };
}
return { erro: true, mensagem: mapearErroFirebaseLogin(codigo) };
}
firebaseAuthToken = data.idToken;
firebaseRefreshToken = data.refreshToken;
firebaseUid = data.localId;
registroLogado = registro;
// Lê dados do usuário (setar admin, tropa, nome) e verifica senha do app
const userData = await checarSeSouAdmin(); // também chama salvarSessao()
const senhaOk = await V2.conferirSenha(senha, userData && userData.senha, registro);
if (!senhaOk) {
limparSessao();
return { erro: true, mensagem: 'Senha incorreta.' };
}
agendarRenovacaoToken();
return { erro: false };
}

let nomeLogado = '';
async function checarSeSouAdmin() {
try {
const r = await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + firebaseUid + '.json'));
const v = await r.json();
souAdmin = !!(v && v.admin === true);
nomeLogado = (v && v.nome) || '';
tropaDoChefeLogado = (v && v.tropa) || null;
salvarSessao(); // persiste tropa e admin na sessão para tropa-senior.html poder ler
return v;
} catch (e) { souAdmin = false; nomeLogado = ''; tropaDoChefeLogado = null; return null; }
}

// ── Painel Gerenciar Chefes (só admins) ──
async function carregarListaChefes() {
try {
const r = await fetch(urlComAuthFirebase(DB_URL + '/usuarios.json'));
const dados = await r.json();
return dados || {};
} catch (e) { return {}; }
}
async function criarNovoChefe(registro, papel, nome, funcao, ehAdmin) {
// papel: seção ('alcateia'|'escoteira'|'senior'|'cla'|'diretoria'); funcao: 'chefe'|'assistente'; admin: boolean
registro = (registro || '').trim();
nome = (nome || '').trim();
if (!registro) return { erro: true, mensagem: 'Digite o registro do novo chefe.' };
const email = emailDoRegistro(registro);
const resp = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FIREBASE_WEB_API_KEY, {
method: 'POST', headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ email, password: registro, returnSecureToken: true })
});
const data = await resp.json();
if (data.error) {
if (data.error.message === 'EMAIL_EXISTS') return { erro: true, mensagem: 'Esse registro já tem acesso cadastrado.' };
return { erro: true, mensagem: 'Não foi possível criar o acesso. Tenta de novo.' };
}
const admin = !!ehAdmin;
const tropa = papel || null;
await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + data.localId + '.json'), {
method: 'PUT', headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ registro, nome: nome || undefined, admin, tropa, funcao: funcao === 'assistente' ? 'assistente' : 'chefe', criadoEm: new Date().toISOString() })
});
return { erro: false };
}

await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + uid + '/admin.json'), { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(novoValor) });
}

method: 'PATCH', headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ tropa: novaSecao || null })
});
}
async function alterarFuncaoChefe(uid, funcao) {
await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + uid + '/funcao.json'), { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(funcao === 'assistente' ? 'assistente' : 'chefe') });
}
async function alterarSenhaChefe(uid, novaSenha) {
// novaSenha: string ou null (null = usar registro como padrão)
await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + uid + '/senha.json'), {
method: 'PUT', headers: {'Content-Type': 'application/json'},
body: JSON.stringify(novaSenha ? await V2.hashSenha(novaSenha) : null)
});
}
// Converte senhas antigas (texto puro) em hash. Roda sozinha quando um admin entra; não muda nada para quem usa.
async function migrarSenhasParaHash() {
  try {
    const todos = await carregarListaChefes();
    const patch = {};
    for (const uid of Object.keys(todos)) {
      const s = todos[uid] && todos[uid].senha;
      if (typeof s === 'string' && s && !V2.senhaComHash(s)) patch[uid + '/senha'] = await V2.hashSenha(s);
    }
    if (!Object.keys(patch).length) return;
    await fetch(urlComAuthFirebase(DB_URL + '/usuarios.json'), { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(patch) });
  } catch (e) { console.warn('Migração de senhas adiada:', e); }
}
async function alterarNomeChefe(uid, novoNome) {
await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + uid + '/nome.json'), { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(novoNome) });
}
async function removerAcessoChefe(uid) {
await fetch(urlComAuthFirebase(DB_URL + '/usuarios/' + uid + '.json'), { method: 'DELETE' });
}

async function abrirHistorico() {
  document.getElementById('chefesModalTitulo').textContent = '📜 Histórico de alterações';
  document.getElementById('chefesModalOv').classList.add('open');
  const corpo = document.getElementById('chefesModalBody');
  corpo.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">Carregando…</div>';
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const lista = await V2.lerHistorico(60);
  if (!lista.length) { corpo.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">Ainda não há alterações registradas.</div>'; return; }
  corpo.innerHTML = lista.map(e => {
    const quando = new Date(e.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    return '<div style="padding:8px 4px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.4;">' +
      '<div style="color:var(--muted);font-size:10px;">' + esc(quando) + ' · ' + ({ senior: 'Tropa Sênior', alcateia: 'Alcateia', cla: 'Clã Pioneiro', diretoria: 'Diretoria' }[e.tropa] || 'Tropa Escoteira') + ' · ' + esc(e.nome || ('Registro ' + e.por)) + '</div>' +
      '<div>' + esc(e.resumo) + '</div></div>';
  }).join('') + '<div style="padding:10px;font-size:10px;color:var(--muted);text-align:center;">Mostrando as 60 mais recentes. O sistema guarda até 300 por tropa.</div>';
  V2.podarHistorico(300);
}

document.getElementById('chefesModalOv').classList.add('open');

const uids = Object.keys(chefes);
let html = `
<div class="chefe-add-row" style="flex-wrap:wrap;gap:6px;">
<input type="text" class="campo-input" id="novoChefeNomeInput" autocomplete="off" placeholder="Nome (opcional)" style="flex:1;min-width:120px;">

<select class="campo-input" id="novoChefeRoleSelect" style="flex:1;min-width:130px;">
<option value="alcateia">🐺 Alcateia</option>
<option value="escoteira">🏕️ Tropa Escoteira</option>
<option value="senior">🎓 Tropa Sênior</option>
<option value="cla">🔥 Clã Pioneiro</option>

</select>
<select class="campo-input" id="novoChefeFuncaoSelect" style="flex:1;min-width:130px;">
<option value="chefe">Chefe de seção</option>
<option value="assistente">Assistente</option>
</select>
<label class="sw-lbl"><span class="sw"><input type="checkbox" id="novoChefeAdminChk"><i></i></span> ⭐ Admin</label>
<button class="chefe-add-btn" onclick="criarNovoChefeUI()">+ Criar</button>
</div>
<div id="novoChefeErro" class="login-erro-msg" style="display:none;margin-bottom:12px;"></div>
`;
if (!uids.length) {
html += '<div style="padding:14px;text-align:center;color:var(--muted);font-size:12px;">Nenhum chefe cadastrado ainda.</div>';
} else {
html += uids.map(uid => {
const c = chefes[uid];
const secao = c.tropa || '';
const ehAss = c.funcao === 'assistente';
const rotSecao = { senior: '🎓 Sênior', alcateia: '🐺 Alcateia', cla: '🔥 Clã Pioneiro', diretoria: '🏛️ Diretoria', escoteira: '🏕️ Escoteira' };
return `<div class="chefe-row" style="flex-wrap:wrap;gap:6px;">
<span class="chefe-row-registro" style="flex:1;min-width:120px;">${c.nome ? c.nome : c.registro || uid}${c.nome ? `<br><span style="font-size:10px;font-weight:500;color:var(--muted);">Registro ${c.registro || uid}</span>` : ''}
<br><span class="chefe-tag ${ehAss ? 'ass' : 'chefe'}">${ehAss ? 'Assistente' : 'Chefe de seção'}</span>${c.admin ? ' <span class="chefe-tag adm">⭐ Admin</span>' : ''}</span>
<select class="campo-input" style="font-size:11px;padding:4px 6px;flex:0 0 auto;" onchange="alterarRoleChefeUI('${uid}', this.value)" title="Seção">
${c.admin ? `<option value="" ${secao===''?'selected':''}>Sem seção (vê tudo)</option>` : ''}
${Object.keys(rotSecao).map(k => `<option value="${k}" ${(secao||(c.admin?'':'escoteira'))===k?'selected':''}>${rotSecao[k]}</option>`).join('')}
</select>
<select class="campo-input" style="font-size:11px;padding:4px 6px;flex:0 0 auto;" onchange="alterarFuncaoChefeUI('${uid}', this.value)" title="Função">
<option value="chefe" ${ehAss?'':'selected'}>Chefe de seção</option>
<option value="assistente" ${ehAss?'selected':''}>Assistente</option>
</select>
<label class="sw-lbl" title="Administrador"><span class="sw"><input type="checkbox" ${c.admin?'checked':''} onchange="alternarAdminUI('${uid}', this.checked, this)"><i></i></span> ⭐ Admin</label>
<button class="chefe-row-btn" onclick="editarNomeChefeUI('${uid}')" title="Editar nome">✏️</button>
<button class="chefe-row-btn" onclick="redefinirSenhaAdmin('${uid}','${c.registro || uid}')" title="Redefinir senha">🔑</button>
${uid !== firebaseUid ? `<button class="chefe-row-btn remover" onclick="removerAcessoChefeUI('${uid}','${c.registro || ''}')">Remover</button>` : ''}
</div>`;
}).join('');
}
chefesCache = chefes;
html += '<div style="font-size:10px;color:var(--muted);margin-top:12px;line-height:1.5;">⚠️ "Remover" tira o acesso, mas o registro continua como login se cadastrado de novo. 🔑 redefine a senha do usuário.</div>';
document.getElementById('chefesModalBody').innerHTML = html;

async function criarNovoChefeUI() {
const inputNome = document.getElementById('novoChefeNomeInput');
const inputRegistro = document.getElementById('novoChefeRegistroInput');
const roleSelect = document.getElementById('novoChefeRoleSelect');
const erroDiv = document.getElementById('novoChefeErro');
erroDiv.style.display = 'none';
const resultado = await criarNovoChefe(inputRegistro.value, roleSelect.value, inputNome.value, document.getElementById('novoChefeFuncaoSelect').value, document.getElementById('novoChefeAdminChk').checked);
if (resultado.erro) {
erroDiv.textContent = resultado.mensagem;
erroDiv.style.display = 'block';
return;
}
inputNome.value = '';
inputRegistro.value = '';
await renderChefesModalBody();
}
async function alterarRoleChefeUI(uid, novaSecao) {
const label = ({ senior: 'Tropa Sênior', alcateia: 'Alcateia', cla: 'Clã Pioneiro', diretoria: 'Diretoria', escoteira: 'Tropa Escoteira' }[novaSecao] || 'Sem seção');
if (!confirm(`Alterar a seção para "${label}"?`)) { await renderChefesModalBody(); return; }
await alterarRoleChefe(uid, novaSecao);
if (uid === firebaseUid) { await checarSeSouAdmin(); fecharGerenciarChefes(); aplicarEstadoContaLogada(); return; }
await renderChefesModalBody();
}
async function alterarFuncaoChefeUI(uid, funcao) {
await alterarFuncaoChefe(uid, funcao);
await renderChefesModalBody();
}
async function alternarAdminUI(uid, valor, el) {
const aviso = uid === firebaseUid && !valor ? `\n\n⚠️ Você está tirando seu PRÓPRIO acesso de administrador e perderá esta tela.` : '';
if (!confirm(`${valor ? 'Dar' : 'Tirar'} acesso de administrador?${aviso}`)) { el.checked = !valor; return; }
await alterarAdminChefe(uid, valor);
if (uid === firebaseUid) { await checarSeSouAdmin(); fecharGerenciarChefes(); aplicarEstadoContaLogada(); return; }
await renderChefesModalBody();
}
async function redefinirSenhaAdmin(uid, registro) {
const novaSenha = prompt(`Redefinir senha de ${registro}:\n\n(Deixe em branco para redefinir ao número do registro)`);
if (novaSenha === null) return; // cancelou
const senhaFinal = novaSenha.trim() || null;
await alterarSenhaChefe(uid, senhaFinal);
alert(senhaFinal ? `Senha atualizada para "${senhaFinal}".` : `Senha redefinida para o número do registro (${registro}).`);
}
async function editarNomeChefeUI(uid) {
const atual = (chefesCache[uid] && chefesCache[uid].nome) || '';
const novoNome = prompt('Nome do chefe (deixe em branco pra remover o nome):', atual);
if (novoNome === null) return;
await alterarNomeChefe(uid, novoNome.trim());
if (uid === firebaseUid) { nomeLogado = novoNome.trim(); aplicarEstadoContaLogada(); }
await renderChefesModalBody();
}
async function alterarAdminChefeUI(uid, novoValor) {
await alterarAdminChefe(uid, novoValor);
await renderChefesModalBody();
}
async function removerAcessoChefeUI(uid, registro) {
if (!confirm(`Remover o acesso de ${registro || 'este chefe'}?`)) return;
await removerAcessoChefe(uid);
await renderChefesModalBody();
}

function fazerLogout() {
if (V2.temPendenciaLocal() && !confirm('Há alterações feitas sem internet que ainda NÃO foram enviadas. Se você sair agora, elas serão apagadas.\n\nSair mesmo assim?')) return;
limparSessao();
window.location.reload();
}

</script>
<script>

// ===== CASCA: navegação entre as seções (cada uma é uma página própria dentro de um iframe) =====
const SECOES = { alcateia:   { pagina: 'alcateia', frame: 'iframeAlcateia', box: 'pagina-alcateia', btn: 'ramoBtnAlcateia' },
                 escoteira:  { pagina: 'escoteira', frame: 'iframeEscoteira', box: 'pagina-escoteira', btn: 'ramoBtnEscoteira' },
                 senior:     { pagina: 'tropa-senior', frame: 'iframeSenior', box: 'pagina-senior', btn: 'ramoBtnSenior' },
                 cla:        { pagina: 'cla-pioneiro', frame: 'iframeCla', box: 'pagina-cla', btn: 'ramoBtnCla' },
                 diretoria:  { pagina: 'diretoria', frame: 'iframeDiretoria', box: 'pagina-diretoria', btn: 'ramoBtnDiretoria' } };
// quem pode abrir cada seção: admin vê tudo; chefe de uma seção vê só a dela; sem seção definida (contas antigas) vê tudo menos a Diretoria
function ramoPermitido(r) { return !!souAdmin || tropaDoChefeLogado === r || (!tropaDoChefeLogado && r !== 'diretoria'); }
let ramoAtual = null;
const compactoPorRamo = {};

function ajustarAlturaIframes() {
  Object.keys(SECOES).forEach(k => {
    const f = document.getElementById(SECOES[k].frame);
    if (!f || f.offsetParent === null) return;
    const topo = f.getBoundingClientRect().top;
    f.style.height = Math.max(window.innerHeight - topo, 320) + 'px';
  });
}
window.addEventListener('resize', ajustarAlturaIframes);

function mudarRamo(r) {
  if (!SECOES[r] || !ramoPermitido(r)) r = Object.keys(SECOES).find(ramoPermitido) || 'escoteira';
  ramoAtual = r;
  try { localStorage.setItem('escoteira_ramoAtivo', r); } catch (e) {}
  Object.keys(SECOES).forEach(k => {
    const s = SECOES[k];
    document.getElementById(s.box).style.display = k === r ? '' : 'none';
    document.getElementById(s.btn).classList.toggle('active', k === r);
  });
  const f = document.getElementById(SECOES[r].frame);
  if (f && !f.getAttribute('src')) f.src = V2.pagina(SECOES[r].pagina); // só carrega a seção quando ela é aberta
  const header = document.querySelector('.header');
  if (header) header.classList.toggle('compacto', !!compactoPorRamo[r]);
  window.scrollTo(0, 0);
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  document.body.style.paddingBottom = '0px';
  requestAnimationFrame(ajustarAlturaIframes);
  setTimeout(ajustarAlturaIframes, 50);
}

window.addEventListener('message', function (ev) {
  const msg = ev.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.tipo === 'headerCompactoSr' || msg.tipo === 'headerCompacto') {
    const r = Object.keys(SECOES).find(k => { const f = document.getElementById(SECOES[k].frame); return f && ev.source === f.contentWindow; });
    if (!r) return;
    compactoPorRamo[r] = !!msg.compacto;
    if (r !== ramoAtual) return;
    const header = document.querySelector('.header');
    if (header) header.classList.toggle('compacto', !!msg.compacto);
    requestAnimationFrame(ajustarAlturaIframes);
    setTimeout(ajustarAlturaIframes, 260);
  }
  if (msg.backupFeito || msg.backupFeitoSr) atualizarLembreteBackup();
});

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('v2.js').catch(() => {}); }); }

async function atualizarLembreteBackup() {
  const antigo = document.getElementById('lembreteBackup'); if (antigo) antigo.remove();
  if (!souAdmin) return;
  const l = await V2.lembreteBackup();
  if (!l) return;
  try { if (localStorage.getItem('lembreteBackupAte') === new Date().toISOString().slice(0, 10) + '|' + l.ciclo) return; } catch (e) {}
  const [ano, mes] = l.ciclo.split('-');
  const nomeMes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][+mes - 1];
  const faltam = l.pendentes.map(t => t === 'escoteira' ? 'Tropa Escoteira' : 'Tropa Sênior').join(' e ');
  const div = document.createElement('div');
  div.id = 'lembreteBackup';
  div.style.cssText = 'position:sticky;top:0;z-index:9999;background:#FFF4D6;border-bottom:2px solid #E6B800;color:#5A4500;padding:8px 12px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;';
  div.innerHTML = '<span>💾 <b>Hora do backup de ' + nomeMes + '/' + ano + '</b> — falta: ' + faltam + '. Use 📤 Exportar backup (na barra Backup de cada tropa).</span>' +
    '<button style="border:1px solid #E6B800;background:#fff;border-radius:12px;padding:3px 10px;font-size:11px;cursor:pointer;" id="lembreteBackupOk">Lembrar amanhã</button>';
  document.body.insertBefore(div, document.body.firstChild);
  document.getElementById('lembreteBackupOk').onclick = () => {
    try { localStorage.setItem('lembreteBackupAte', new Date().toISOString().slice(0, 10) + '|' + l.ciclo); } catch (e) {}
    div.remove();
  };
}
function aplicarEstadoContaLogada() {
const txt = document.getElementById('contaRegistroTxt');
if (txt) txt.textContent = nomeLogado ? nomeLogado : ('Registro ' + (registroLogado || ''));
const btnAdmin = document.getElementById('btnGerenciarChefes');
if (btnAdmin) btnAdmin.style.display = souAdmin ? '' : 'none';
document.body.classList.toggle('eh-admin', !!souAdmin);
if (souAdmin) { migrarSenhasParaHash(); atualizarLembreteBackup(); }
else { const lb = document.getElementById('lembreteBackup'); if (lb) lb.remove(); }

// Restrição de acesso por seção
const ramoSwitch = document.getElementById('ramoSwitch');
const vePrimeiraSecao = !!souAdmin || !tropaDoChefeLogado;
const btnDir = document.getElementById('ramoBtnDiretoria'); if (btnDir) btnDir.style.display = souAdmin ? '' : 'none';
if (ramoSwitch) ramoSwitch.style.display = vePrimeiraSecao ? '' : 'none';
const ramoPref = (function(){ try { return localStorage.getItem('escoteira_ramoAtivo') || 'escoteira'; } catch(e){ return 'escoteira'; } })();
mudarRamo(vePrimeiraSecao ? ramoPref : tropaDoChefeLogado);
}

async function tentarLoginTela() {
const inputReg = document.getElementById('loginRegistroInput');
const inputSenha = document.getElementById('loginSenhaInput');
const btn = document.getElementById('loginEntrarBtn');
const erroDiv = document.getElementById('loginErroMsg');
erroDiv.style.display = 'none';
const registro = inputReg.value.trim();
const senha = inputSenha ? inputSenha.value.trim() : '';
if (!registro) { erroDiv.textContent = 'Digite o registro escoteiro.'; erroDiv.style.display = 'block'; return; }
btn.disabled = true;
btn.textContent = 'Entrando...';
const resultado = await fazerLoginRegistro(registro, senha);
btn.disabled = false;
btn.textContent = 'Entrar';
if (resultado.erro) {
erroDiv.textContent = resultado.mensagem;
erroDiv.style.display = 'block';
return;
}
document.getElementById('loginGateOv').style.display = 'none';
aplicarEstadoContaLogada();
}

async function iniciarComLogin() {
const restaurou = await tentarRestaurarSessao();
if (restaurou) {
document.getElementById('loginGateOv').style.display = 'none';
aplicarEstadoContaLogada();
} else {
document.getElementById('loginRegistroInput').focus();
}
}
iniciarComLogin();

</script>
