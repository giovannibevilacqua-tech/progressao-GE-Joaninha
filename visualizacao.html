<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualização — Progressão Jovens GE Joaninha</title>
<style>
:root {
--vinho: #1A6B3C;
--bg: #F4F1EC;
--card: #FFFFFF;
--text: #1A1A1A;
--muted: #6B6B6B;
--border: #E4DFD6;
--r: 10px;
--shadow: 0 2px 8px rgba(0,0,0,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding-bottom: 24px;
}
.cabecalho-fixo { position: sticky; top: 0; z-index: 310; background: var(--bg); overflow-anchor: none; }
.header {
background: linear-gradient(160deg, #C1121F 0%, #9A0D18 60%, #E63946 100%);
color: #fff;
padding: 20px 16px 16px;
text-align: center;
transition: padding .25s ease;
}
.header.compacto { padding: 8px 16px; }
.header-flor { font-size: 30px; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); transition: opacity .2s ease, max-height .2s ease, margin .2s ease; max-height: 40px; overflow: hidden; }
.header.compacto .header-flor { opacity: 0; max-height: 0; margin: 0; }
.header h1 { font-size: 17px; font-weight: 800; letter-spacing: .5px; line-height: 1.3; transition: font-size .2s ease; }
.header.compacto h1 { font-size: 13px; }
.header .sub { font-size: 12px; opacity: .82; margin-top: 4px; transition: opacity .2s ease, max-height .2s ease, margin .2s ease; max-height: 30px; overflow: hidden; }
.header.compacto .sub { opacity: 0; max-height: 0; margin: 0; }
.badge-view {
display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.18);
border: 1px solid rgba(255,255,255,.32); color: #fff; font-size: 10px; font-weight: 700;
padding: 3px 10px; border-radius: 20px; margin-top: 8px;
}
.tabs-linha { display: flex; background: var(--card); border-bottom: 2px solid var(--border); overflow-x: auto; overflow-y: hidden; }
.tab-btn-linha {
flex: 1; min-width: 120px; padding: 14px 10px; border: none; border-bottom: 3px solid transparent;
background: transparent; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
transition: color .2s, border-color .2s; white-space: nowrap;
}
.tab-btn-linha.active { color: var(--vinho); border-bottom-color: var(--vinho); }
.pagina-view { display: none; }
.pagina-view.active { display: block; }
.aviso-view {
margin: 12px 14px 0; background: #FFF9E6; border-left: 4px solid #F0B429; border-radius: 0 var(--r) var(--r) 0;
padding: 10px 12px; font-size: 11px; color: #7A5A00; line-height: 1.5;
}
.hint-vazio, .hint-vazio-sm { color: var(--muted); font-size: 12px; padding: 16px; text-align: center; }
.hint-vazio-sm { padding: 10px 4px; text-align: left; font-size: 11px; }

/* Calendário */
.evento-card-view { display: flex; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); margin: 10px 14px 0; overflow: visible; position: relative; }
.evento-data-view { width: 56px; min-width: 56px; background: var(--vinho); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px; border-radius: var(--r) 0 0 var(--r); }
.ev-dia { font-size: 18px; font-weight: 900; line-height: 1.1; }
.ev-mes { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
.evento-corpo-view { flex: 1; padding: 12px 14px; min-width: 0; }
.evento-nome-view { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
.evento-local-view, .evento-resp { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.evento-blocos-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 2px; }
.evento-bloco-tag-view {
font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; color: #fff; white-space: nowrap;
position: relative; cursor: pointer;
}
.itens-popup-view {
display: none; position: absolute; top: 100%; left: 0; margin-top: 0; z-index: 40;
background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
box-shadow: var(--shadow); padding: 10px 12px; min-width: 220px; max-width: 300px;
font-size: 11px; font-weight: 500; white-space: normal; text-align: left; line-height: 1.5;
}
.evento-bloco-tag-view.aberto .itens-popup-view, .evento-bloco-tag-view.hover-aberto .itens-popup-view { display: block; }
.itens-popup-bloco-view { font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); margin: 6px 0 2px; }
.itens-popup-bloco-view:first-child { margin-top: 0; }
.itens-popup-item-view { padding: 2px 0; }
.evento-desc-view { font-size: 12px; color: #3A3A3A; line-height: 1.5; white-space: pre-line; margin-top: 6px; }
.evento-extra-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.evento-link { font-size: 11px; font-weight: 700; color: var(--vinho); text-decoration: none; }
.evento-anexo-tag { font-size: 10px; font-weight: 700; background: #EEF2FF; color: var(--vinho); border: 1px solid #C0CCF0; border-radius: 20px; padding: 3px 9px; }
.evento-resposta-view { background: #FAFAF8; border-left: 3px solid var(--vinho); border-radius: 0 8px 8px 0; padding: 7px 10px; font-size: 11px; color: #3A3A3A; margin-top: 8px; line-height: 1.5; white-space: pre-line; }
.fmt-badge { font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 20px; letter-spacing: .5px; margin-right: 5px; }
.fmt-T { background: #EBF5FB; color: #1565C0; }
.fmt-P { background: #F4ECF7; color: #6A1B9A; }
.fmt-PN { background: #D6EAF8; color: #0D47A1; }
.fmt-Av { background: #EAFAF1; color: #1A7434; }
.fmt-Esp { background: #FFF9C4; color: #7A4A00; }
.externa-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 20px; background: #E8F5E9; color: #1E7A34; border: 1px solid #A8D8B0; margin-right: 5px; }

/* Ciclo de Programa */
.ciclo-grupo-view { margin: 14px 14px 0; }
.ciclo-grupo-header-view {
background: linear-gradient(160deg, var(--vinho) 0%, #2D8659 100%); color: #fff;
display: flex; align-items: center; justify-content: space-between; gap: 10px;
padding: 13px 16px; border-radius: var(--r); cursor: pointer; box-shadow: var(--shadow);
}
.ciclo-grupo-header-view:hover { filter: brightness(1.06); }
.ciclo-grupo-titulo-view { font-size: 13px; font-weight: 800; }
.ciclo-grupo-sub-view { font-size: 10px; font-weight: 600; opacity: .85; margin-top: 2px; }
.ciclo-grupo-periodo-view { font-size: 11px; font-weight: 700; opacity: .9; white-space: nowrap; }
.chev-view { color: #fff; font-size: 13px; flex-shrink: 0; }
.ciclo-grupo-body-view { margin-top: 10px; }
.sem-card-view { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 8px; overflow: hidden; }
.sem-card-header-view {
display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px;
background: #FAFAF8; cursor: pointer; font-size: 12px; font-weight: 800; color: var(--text);
}
.sem-card-header-view:hover { background: #F2EFEA; }
.sem-card-header-view .chev-view { color: var(--muted); }
.sem-card-body-view { padding: 12px 14px; }
.blocos-grid-view { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.bloco-chip-view { border-radius: 8px; padding: 9px 8px; font-size: 11px; font-weight: 700; line-height: 1.3; min-height: 50px; display: flex; align-items: center; justify-content: center; text-align: center; }
.metas-view { margin-top: 12px; padding-top: 10px; border-top: 1px solid #F0EDE8; }
.secao-label-view { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 7px; }
.meta-item-view { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid #F5F2EE; }
.meta-item-view:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="scrollSentinelView" style="position:absolute;top:0;left:0;width:1px;height:1px;"></div>

<div class="cabecalho-fixo" id="cabecalhoFixo">
<header class="header">
<div class="header-flor">⚜</div>
<h1>PROGRESSÃO JOVENS<br>GE JOANINHA</h1>
<div class="sub">Tropa Escoteira — Visualização</div>
<div class="badge-view">🔒 Modo somente leitura</div>
</header>

<nav class="tabs-linha">
<button class="tab-btn-linha active" id="tabCalView" onclick="mudarPaginaView('calendario')">📅 Calendário</button>
<button class="tab-btn-linha" id="tabCicloView" onclick="mudarPaginaView('ciclo')">🔄 Ciclo de Programa</button>
</nav>
</div>

<div id="pagina-calendario-view" class="pagina-view active">
<div class="aviso-view">Esta é uma versão de visualização — sem opções de editar, adicionar ou remover atividades, e sem a lista de presença de cada uma.</div>
<div id="listaEventosView"></div>
</div>

<div id="pagina-ciclo-view" class="pagina-view">
<div class="aviso-view">Esta é uma versão de visualização — sem opções de editar blocos ou ciclos.</div>
<div id="listaCicloView"></div>
</div>


<script>
// ── Dados base ───────────────────────────────────────────
const ICONE_FOLHA = '<svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.5 3.5 4 8 4 13c0 4.4 3.6 8 8 8s8-3.6 8-8c0-6-3.5-9.5-8-11z"/><rect x="11.3" y="6" width="1.4" height="13" fill="white" opacity="0.55"/></svg>';
const ICONE_POMBA = '<svg viewBox="0 0 24 24" fill="white"><path d="M23 4.2c-.8.5-1.7.8-2.6.9a4.7 4.7 0 0 0 2-2.6c-.9.5-1.9.9-3 1.1a4.6 4.6 0 0 0-7.9 4.2A13.1 13.1 0 0 1 2 2.9a4.6 4.6 0 0 0 1.4 6.2 4.6 4.6 0 0 1-2.1-.6v.1a4.6 4.6 0 0 0 3.7 4.5c-.7.2-1.4.2-2 .1a4.6 4.6 0 0 0 4.3 3.2A9.3 9.3 0 0 1 0 18.6a13 13 0 0 0 7.1 2.1c8.5 0 13.2-7.4 13.2-13.8v-.6c.9-.6 1.7-1.4 2.3-2.3z"/></svg>';
const ICONE_MAOS_CORACAO = '<svg viewBox="0 0 24 24" fill="white"><path d="M12.5 6.7c1.6-1.9 4.4-2.2 6.2-.5 1.8 1.7 1.9 4.5.2 6.3L12 19.5l-6.9-7c-1.7-1.8-1.6-4.6.2-6.3 1.8-1.7 4.6-1.4 6.2.5z"/><path d="M2.5 12.2 5.2 9.6a1.7 1.7 0 0 1 2.3 0l.5.5-1.6 1.7a1.15 1.15 0 0 0 1.6 1.65l2.2-2.2 1.1 1.15-2.2 2.2a1.15 1.15 0 0 0 1.6 1.65l2.2-2.2" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/></svg>';
const ICONE_BUSSOLA = '<svg viewBox="0 0 24 24" fill="white"><path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm0 1.8a9.2 9.2 0 1 1 0 18.4 9.2 9.2 0 0 1 0-18.4z"/><path d="M16.5 7.5 13 13l-5.5 3.5L11 11z"/></svg>';

const EIXOS = [
{ id:'ma', nome:'Meio Ambiente', cor:'#5CB85C', icone: ICONE_FOLHA, blocos:['mudancas','consumo','preservacao','vida_ar'] },
{ id:'pd', nome:'Paz e Desenvolvimento', cor:'#1B3B6F', icone: ICONE_POMBA, blocos:['paz','heranca','democracia','comunidade','valores'] },
{ id:'sb', nome:'Saúde e Bem-estar', cor:'#DB9270', icone: ICONE_MAOS_CORACAO, blocos:['habitos','saude_mental','cuidado','vinculos','espiritualidade'] },
{ id:'hv', nome:'Habilidades para a Vida', cor:'#E0355F', icone: ICONE_BUSSOLA, blocos:['criatividade','inteligencia','aprendizagem','autonomia'] },
];

const BLOCOS = {
criatividade:{nome:'1. Criatividade e Inovação', metaVar:4,
fixas:['Animar um Fogo de Conselho em um acampamento da patrulha ou de tropa.','Aplicar conceitos básicos de estruturas (cavaletes, encaixes, ancoragens) em projetos como pontes, balsas, pórticos ou outras pioneirias.'],
variaveis:['Organizar uma atividade de divulgação do escotismo no colégio, usando diferentes recursos: vídeos, cartazes, panfletos etc.','Conhecer e cantar canções e danças apropriadas para diferentes momentos.','Criar uma campanha publicitária divertida promovendo algum projeto ou atividade da patrulha ou Tropa Escoteira.','Construir equipamentos improvisados de campo (mesa, suporte, abrigo, utensílios) utilizando materiais disponíveis.','Propor e implementar soluções criativas para reduzir custos de uma atividade, aproveitando materiais recicláveis ou doados.','Ensinar e aplicar dois novos jogos para sua tropa.','Criar alternativas criativas para decorar o canto da patrulha ou o acampamento.','Participar de um festival de talentos na tropa.','Improvisar apresentações artísticas (esquetes, músicas, danças) em um Fogo de Conselho, explorando recursos disponíveis.','Criar um vídeo de divulgação das atividades de sua patrulha ou tropa.','Especialidade - Equivalente a 1 item variável']},
inteligencia:{nome:'2. Inteligência Emocional', metaVar:4,
fixas:['Identificar situações perigosas e de maus tratos, sabendo como agir e a quem recorrer.'],
variaveis:['Conversar com a patrulha sobre pontos fortes e de melhoria no desempenho da equipe em atividades e acampamentos.','Identificar seus medos e suas emoções diante a um obstáculo desafiador, trabalhando para conseguir superá-lo.','Em um acampamento, participar de um turno de ronda com outro companheiro de patrulha, refletindo sobre o cuidado com o outro.','Participar de jogos ou competições, respeitando regras e resultados.','Em uma atividade de patrulha ou de tropa aplicar técnicas de respiração, relaxamento ou meditação antes de um grande desafio.','Participar de rodas de conversa ou momentos de partilha após atividades intensas, ouvindo e respeitando as emoções dos demais.','Escrever uma pequena carta para si mesmo com palavras de incentivo, lembrando de suas qualidades e dando sugestões de como você pode superar desafios futuros.','Criar e encenar uma pequena história em que o personagem passa por dificuldades e encontra formas saudáveis de lidar com elas.','Especialidade - Equivalente a 1 item variável']},
aprendizagem:{nome:'3. Aprendizagem Contínua e Desenvolvimento Vocacional', metaVar:4,
fixas:['Conquistar, no Ramo Escoteiro, uma especialidade sobre um tema de seu interesse e que seja um conhecimento novo.','Em conjunto com a sua patrulha, realizar um Percurso de Gilwell de pelo menos 3km.'],
variaveis:['Enviar e receber mensagens simples em Alfabeto Fonético, Código Internacional de Sinais, Semáfora, Heliografia, Cifra de César ou Criptografia.','Visitar com a sua patrulha: hospital, quartel de bombeiros, delegacia, empresas, comércios locais ou outros para conhecer o funcionamento de diferentes profissões.','Conhecer o funcionamento de serviços de internet, rádio e TV, e usar esses conhecimentos para resolver problemas técnicos.','Convidar um especialista da comunidade para dialogar com a tropa e esclarecer dúvidas sobre determinado tema ou profissão.','Utilizar corretamente um rádio comunicador em atividade da patrulha.','Realizar uma pesquisa sobre um tema escolhido e apresentar os resultados para a patrulha ou tropa em formato criativo (cartaz, teatro, vídeo, oficina).','Planejar e executar, em conjunto com a sua patrulha, uma ação de serviço comunitário baseada em informações pesquisadas sobre necessidades locais.','Especialidade - Equivalente a 1 item variável']},
autonomia:{nome:'4. Autonomia e Liderança', metaVar:5,
fixas:['Montar corretamente uma mochila para um acampamento, mantendo o equipamento pessoal em bom estado.'],
variaveis:['Contribuir para o planejamento e a organização de uma excursão de patrulha.','Fazer uma excursão urbana com a sua patrulha ou tropa, se locomovendo por meio de transportes públicos como ônibus, trens, metrô, entre outros.','Pesquisar e realizar as compras dos alimentos para um acampamento, apresentando para a patrulha uma prestação de contas.','Saber onde encontrar, identificando em um mapa, os principais serviços públicos na cidade.','Planejar e executar em patrulha um projeto de captação de recursos para participação em uma atividade escoteira.','Participar de atividades ou oficinas sobre finanças pessoais.','Assumir pelo menos três encargos diferentes na patrulha, sendo bem avaliado pelos seus companheiros.','Administrar o fundo de patrulha por pelo menos três meses, registrando receitas e despesas, e utilizar os recursos em atividades planejadas pela patrulha.','Registrar receitas e despesas simples ou da mesada em planilha ou caderno por um período determinado.','Conduzir uma reunião de patrulha como monitor ou secretário, registrando decisões e acompanhando sua execução.','Especialidade - Equivalente a 1 item variável']},
mudancas:{nome:'5. Mudanças Climáticas', metaVar:5,
fixas:[],
variaveis:['Em um acampamento, criar uma estação meteorológica simples para registrar temperatura, umidade, direção do vento, nuvens e possíveis mudanças no tempo.','Participar da construção de um fogão solar e usá-lo em um acampamento de patrulha ou tropa.','Participar de uma excursão urbana com foco ecológico, identificando situações de risco para a sociedade referentes às mudanças climáticas.','Visitar ou participar de uma atividade com uma organização que atua em prol do meio ambiente.','Em uma excursão ou acampamento em área não urbana, identificar ações prejudiciais à natureza, como extrativismo e mineração, e listar seus impactos.','Planejar e participar de uma excursão, utilizando meios de transporte que dependem de fontes de energia limpa (bicicleta, ônibus elétrico, embarcação a remo, entre outros).','Organizar, com sua patrulha ou tropa, um projeto de conscientização sobre o uso de energia e água em sua escola, condomínio ou sede da UEL.','Participar de mutirões de plantio de mudas ou cultivo de uma horta em casa, na escola ou na UEL.','Especialidade - Equivalente a 1 item variável']},
consumo:{nome:'6. Consumo Responsável', metaVar:5,
fixas:['Em acampamentos e excursões, criar soluções para melhorar a higiene e conforto e classificar os resíduos em categorias, tratando-os adequadamente.','Planejar adequadamente e adquirir as quantidades dos alimentos para refeições em um acampamento para sua patrulha, evitando desperdício.'],
variaveis:['Registrar e analisar o consumo de água e energia da sua residência, buscando ideias para economizar, e apresentar para sua patrulha os resultados.','Avaliar o impacto ambiental de uma atividade e apresentar alternativas mais sustentáveis.','Visitar uma estação de energia renovável, uma estação de tratamento de água, uma cooperativa ou usina de reciclagem ou outras opções semelhantes.','Consertar objetos simples, como brinquedos ou pequenos eletrodomésticos.','Utilizar embalagens retornáveis ou reutilizáveis nas refeições de campo, evitando descartáveis.','Separar resíduos orgânicos e criar um sistema de compostagem caseira.','Criar uma campanha educativa para a tropa sobre consumo consciente e economia de recursos.','Trocar roupas, livros ou jogos com amigos e familiares em vez de comprar novos.','Organizar, com sua patrulha, uma campanha de conscientização sobre consumo responsável.','Confeccionar utensílios ou equipamentos a partir de materiais reciclados para uso nas atividades da patrulha.','Planejar e realizar as refeições de um dia de acampamento sem carne, garantindo a ingestão adequada de proteínas.','Organizar, cuidar e fazer reparos nos materiais da patrulha.','Especialidade - Equivalente a 1 item variável']},
preservacao:{nome:'7. Preservação da Biodiversidade', metaVar:5,
fixas:['Participar, em patrulha, de uma atividade de exploração em ambiente natural, reconhecendo a fauna e a flora locais e identificando riscos à preservação, além de propor soluções para evitá-los.'],
variaveis:['Reconhecer os animais venenosos e peçonhentos da região e saber como agir em casos de picadas ou contaminação.','Planejar e executar um projeto ambiental com a patrulha ou tropa.','Plantar uma espécie nativa e observar seu crescimento, registrando cada etapa.','Identificar as pegadas de pelo menos cinco animais da fauna brasileira e realizar levantamento das pegadas em áreas naturais.','Participar de uma atividade de mergulho que tenha o objetivo de conhecer e explorar a vida na água.','Participar de uma atividade de observação de animais noturnos com sua patrulha.','Observar e registrar espécies de aves, insetos, plantas ou outros animais durante um acampamento ou excursão.','Visitar parques, reservas ou centros de proteção ambiental para conhecer ações de preservação da fauna e da flora.','Construir comedouros ou bebedouros para aves e instalar em áreas adequadas, acompanhando seu uso.','Criar materiais educativos, como vídeos ou posts, sobre a importância de preservar a biodiversidade.','Especialidade - Equivalente a 1 item variável']},

const FIREBASE_WEB_API_KEY = "AIzaSyB50r7SU6qU_dwq03v_oQksLi1bAxbU614";
let firebaseAuthToken = null;
async function autenticarFirebaseAnonimo() {
if (!FIREBASE_WEB_API_KEY || FIREBASE_WEB_API_KEY.indexOf('COLE_AQUI') === 0) {
console.warn('Firebase: chave de API da Web não configurada.');
return null;
}
try {
const resp = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FIREBASE_WEB_API_KEY, {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ returnSecureToken: true })
});
const data = await resp.json();
if (data && data.idToken) {
firebaseAuthToken = data.idToken;
setTimeout(autenticarFirebaseAnonimo, 50 * 60 * 1000);
}
return firebaseAuthToken;
} catch (e) {
console.error('Falha ao autenticar no Firebase:', e);
return null;
}
}
function urlComAuthFirebase(url) {
if (!firebaseAuthToken) return url;
return url + (url.indexOf('?') !== -1 ? '&' : '?') + 'auth=' + firebaseAuthToken;
}

const DB_URL = "https://joaninha-progressao-default-rtdb.firebaseio.com";
const REST_URL = DB_URL + "/tropaProgressao/json.json";

let EVENTOS = [];
let CICLO = [];
let CICLO_INFO = {};

async function carregarDadosView() {
await autenticarFirebaseAnonimo();
try {
const r = await Promise.race([
fetch(urlComAuthFirebase(REST_URL)),
new Promise((_, reject) => setTimeout(() => reject(new Error('Tempo limite ao buscar dados')), 6000))
]);
const valor = await r.json();
if (valor) {
const dados = JSON.parse(valor);
EVENTOS = dados.eventos || [];

} catch (e) {

// ── Calendário (somente leitura, sem lista de presença) ──
function parseItemId(itemId) {
const [blocoId, tipo, idxStr] = itemId.split('|');
return { blocoId, tipo, idx: parseInt(idxStr, 10) };
}
const EMOJI_EIXO_VIEW = { ma: '🌿', pd: '🕊', sb: '🤝', hv: '🧭' };
function itensAgrupadosPorEixoView(itens) {
const porEixo = {};
(itens || []).forEach(itemId => {
const { blocoId, tipo, idx } = parseItemId(itemId);
const def = BLOCOS[blocoId];
if (!def) return;
const texto = tipo === 'f' ? def.fixas[idx] : def.variaveis[idx];
if (texto === undefined) return;
const eixo = EIXOS.find(e => e.blocos.includes(blocoId));
if (!eixo) return;
if (!porEixo[eixo.id]) porEixo[eixo.id] = { eixo, blocos: {} };
if (!porEixo[eixo.id].blocos[blocoId]) porEixo[eixo.id].blocos[blocoId] = [];
porEixo[eixo.id].blocos[blocoId].push(texto);
});
return porEixo;
}
function construirBolhasItensView(itens) {
const porEixo = itensAgrupadosPorEixoView(itens);
const eixoIds = Object.keys(porEixo);
if (!eixoIds.length) return '';
return `<div class="evento-blocos-row">` + eixoIds.map(eixoId => {
const grupo = porEixo[eixoId];
const total = Object.values(grupo.blocos).reduce((s, arr) => s + arr.length, 0);
const popupHtml = Object.keys(grupo.blocos).map(b => `<div class="itens-popup-bloco-view">${BLOCOS[b].nome}</div>${grupo.blocos[b].map(t => `<div class="itens-popup-item-view">• ${t}</div>`).join('')}`).join('');
return `<span class="evento-bloco-tag-view" style="background:${grupo.eixo.cor};" onclick="event.stopPropagation();this.classList.toggle('aberto')" onmouseenter="bolhaMouseEnterView(this)" onmouseleave="bolhaMouseLeaveView(this)">
${EMOJI_EIXO_VIEW[eixoId] || '📘'} ${grupo.eixo.nome} · ${total} ${total === 1 ? 'item' : 'itens'}
<div class="itens-popup-view" onclick="event.stopPropagation()">${popupHtml}</div>
</span>`;
}).join('') + `</div>`;
}
document.addEventListener('click', () => { document.querySelectorAll('.evento-bloco-tag-view.aberto').forEach(el => el.classList.remove('aberto')); });

function renderCalendarioVisualizacao() {
const el = document.getElementById('listaEventosView');
if (!EVENTOS.length) { el.innerHTML = '<div class="hint-vazio">Nenhuma atividade cadastrada ainda.</div>'; return; }
const ordenados = [...EVENTOS].filter(e => e.data).sort((a, b) => a.data.localeCompare(b.data));
el.innerHTML = ordenados.map(ev => {
const partes = ev.data.split('-');
const mesTxt = MESES_ABREV[parseInt(partes[1], 10) - 1] || '';
const dia = partes[2] || '';
const respHtml = (ev.responsaveis && ev.responsaveis.length) ? `<div class="evento-resp">👤 ${ev.responsaveis.join(', ')}</div>` : '';
const linkHtml = ev.link ? `<a class="evento-link" href="${ev.link}" target="_blank" rel="noopener">🔗 Abrir link</a>` : '';
const anexoHtml = ev.anexo ? `<span class="evento-anexo-tag">📎 ${ev.anexo.name}</span>` : '';
const respostaHtml = ev.resposta ? `<div class="evento-resposta-view">💬 ${ev.resposta}</div>` : '';
const blocosHtml = construirBolhasItensView(ev.itens);
return `<div class="evento-card-view">
<div class="evento-data-view">
<div class="ev-dia">${dia}</div><div class="ev-mes">${mesTxt}</div>
</div>
<div class="evento-corpo-view">
<div class="evento-nome-view">${ev.tipo ? `<span class="fmt-badge fmt-${ev.tipo}">${ev.tipo}</span>` : ''}${ev.externa ? `<span class="externa-badge">🌍 Externa</span>` : ''}${ev.nome || ''}</div>
${ev.local ? `<div class="evento-local-view">📍 ${ev.local}</div>` : ''}
${respHtml}
${blocosHtml}
${ev.descricao ? `<div class="evento-desc-view">${ev.descricao}</div>` : ''}
${(linkHtml || anexoHtml) ? `<div class="evento-extra-row">${linkHtml}${anexoHtml}</div>` : ''}
${respostaHtml}
</div>
</div>`;
}).join('');
}

let ciclosGrupoAbertosView = {};
let semCardsAbertosView = {};
function toggleGrupoView(g) { ciclosGrupoAbertosView[g] = ciclosGrupoAbertosView[g] === undefined ? false : !ciclosGrupoAbertosView[g]; renderCicloVisualizacao(); }
function toggleSemView(i) { semCardsAbertosView[i] = semCardsAbertosView[i] === undefined ? false : !semCardsAbertosView[i]; renderCicloVisualizacao(); }

function renderSemestreView(i, sem) {
const aberto = semCardsAbertosView[i] === undefined ? true : semCardsAbertosView[i];
const intervalo = sem.ano ? (sem.semestre === '1' ? `Jan/${sem.ano} → Jun/${sem.ano}` : `Jul/${sem.ano} → Dez/${sem.ano}`) : '';
const blocosSelecionados = (sem.blocos || []).filter(Boolean);
let blocosHtml;
if (!blocosSelecionados.length) {
blocosHtml = `<div class="hint-vazio-sm">Nenhum bloco selecionado.</div>`;
} else {
blocosHtml = `<div class="blocos-grid-view">` + blocosSelecionados.map(b => {
const def = BLOCOS[b];
const eixo = EIXOS.find(e => e.blocos.includes(b));
const cor = eixo ? eixo.cor : '#666';
return `<div class="bloco-chip-view" style="background:${cor}16;border:1px solid ${cor}50;color:${cor};">${def ? def.nome : b}</div>`;
}).join('') + `</div>`;
}
let externasHtml = '';
if (sem.ano) {
const intervaloObj = { inicio: sem.semestre === '1' ? `${sem.ano}-01-01` : `${sem.ano}-07-01`, fim: sem.semestre === '1' ? `${sem.ano}-06-30` : `${sem.ano}-12-31` };
const externas = EVENTOS.filter(e => e.externa && e.data && e.data >= intervaloObj.inicio && e.data <= intervaloObj.fim).sort((a, b) => a.data.localeCompare(b.data));
if (externas.length) {
externasHtml = `<div class="metas-view">
<div class="secao-label-view">📍 Atividades externas</div>
${externas.map(ev => { const p = ev.data.split('-'); return `<div class="meta-item-view"><span>${p[2]}/${p[1]}</span><span>${ev.nome}</span></div>`; }).join('')}
</div>`;
}
}

return `<div class="sem-card-view">
<div class="sem-card-header-view" onclick="toggleSemView(${i})">
<span>${(i % 6) + 1}º Semestre${intervalo ? ` — ${intervalo}` : ''}</span>
<span class="chev-view">${aberto ? '▴' : '▾'}</span>
</div>
${aberto ? `<div class="sem-card-body-view">${blocosHtml}${externasHtml}</div>` : ''}
</div>`;
}

</div>
${aberto ? `<div class="ciclo-grupo-body-view">
${semestresDoGrupo.map((sem, k) => renderSemestreView(inicioIdx + k, sem)).join('')}
</div>` : ''}
</div>`;
}
el.innerHTML = html;
}

// ── Cabeçalho compacto ao rolar (sensor de interseção, mesmo padrão robusto do app principal) ──
function iniciarObservadorHeaderCompactoView() {
const sentinela = document.getElementById('scrollSentinelView');
const header = document.querySelector('.header');
if (!sentinela || !header) return;
if (!('IntersectionObserver' in window)) return;
const observer = new IntersectionObserver((entries) => {
entries.forEach((entry) => {
header.classList.toggle('compacto', !entry.isIntersecting);
});
}, { threshold: 0 });
observer.observe(sentinela);
}
iniciarObservadorHeaderCompactoView();

carregarDadosView();
</script>
